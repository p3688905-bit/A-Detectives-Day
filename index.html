/* ============ 去背（magenta chroma key）＋自動裁邊 ============ */
function trimCanvas(c){
 try{
  const x=c.getContext('2d');
  const d=x.getImageData(0,0,c.width,c.height).data;
  let minX=c.width,minY=c.height,maxX=0,maxY=0,found=false;
  for(let py=0;py<c.height;py+=2){
    for(let px2=0;px2<c.width;px2+=2){
      if(d[(py*c.width+px2)*4+3]>16){
        found=true;
        if(px2<minX)minX=px2; if(px2>maxX)maxX=px2;
        if(py<minY)minY=py; if(py>maxY)maxY=py;
      }
    }
  }
  if(!found)return c;
  minX=Math.max(0,minX-2);minY=Math.max(0,minY-2);
  maxX=Math.min(c.width-1,maxX+2);maxY=Math.min(c.height-1,maxY+2);
  const w=maxX-minX,h=maxY-minY;
  if(w<20||h<20)return c;
  const o=document.createElement('canvas');o.width=w;o.height=h;
  o.getContext('2d').drawImage(c,minX,minY,w,h,0,0,w,h);
  return o;
 }catch(e){return c;}
}
function chromaKey(img){
 try{
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;let cut=0;const total=p.length/4;
  for(let i=0;i<p.length;i+=4){
    const r=p[i],g=p[i+1],b=p[i+2],mag=Math.min(r,b)-g;
    if(mag>90){p[i+3]=0;cut++;}
    else if(mag>55){p[i+3]=Math.round(255*(1-(mag-55)/35));p[i]=Math.min(r,g+50);p[i+2]=Math.min(b,g+50);cut++;}
  }
  x.putImageData(d,0,0);
  const ratio=cut/total;if(ratio<0.05||ratio>0.96)return null;
  return trimCanvas(c).toDataURL('image/png');
 }catch(e){return null;}
}
function loadImg(src,cors){return new Promise((res,rej)=>{const im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function prepSprite(id){
 try{
   const res=await fetch(IMG[id],{mode:'cors'});const blob=await res.blob();
   const ob=URL.createObjectURL(blob);const im=await loadImg(ob);
   const keyed=chromaKey(im);URL.revokeObjectURL(ob);
   if(keyed){SPR[id]={src:keyed,ok:true};return;}
 }catch(e){}
 try{const im=await loadImg(IMG[id],true);const keyed=chromaKey(im);if(keyed){SPR[id]={src:keyed,ok:true};return;}}catch(e){}
 SPR[id]={src:IMG[id],ok:true,card:true};

const LABELS={};SCRIPT.forEach((e,i)=>{if(e.label)LABELS[e.label]=i;});
/* ================= 引擎 ================= */
const G={idx:0,flags:{},sprites:{},curBg:null,started:false,waiting:false,typing:false,auto:false,skip:false,chapter:'',log:[],full:''};
let cardOpen=false,itemOpen=false,choiceOpen=false,cardT=null,autoT=null,typeT=null;
const bgA=$('bgA'),bgB=$('bgB'),sprBox=$('sprites'),box=$('textbox'),nameEl=$('nameplate'),advEl=$('adv');
let bgFront=bgA;
function setBg(key,instant){
 G.curBg=key;const url=IMG['bg_'+key];if(!url)return;
 if(instant){bgFront.style.backgroundImage='url("'+url+'")';bgFront.style.opacity=1;
   const back=bgFront===bgA?bgB:bgA;back.style.opacity=0;return;}
 const back=bgFront===bgA?bgB:bgA;
 back.style.backgroundImage='url("'+url+'")';back.style.opacity=1;bgFront.style.opacity=0;bgFront=back;
}
function renderSprites(who){
 sprBox.innerHTML='';
 const ids=Object.keys(G.sprites);
 sprBox.classList.toggle('three',ids.length>=3);
 ids.forEach(id=>{
   if(!SPR[id])return;
   const d=document.createElement('div');d.className='spr pos-'+G.sprites[id];
   const im=document.createElement('img');im.src=SPR[id].src;
   if(SPR[id].card){im.style.borderRadius='12px';im.style.boxShadow='0 10px 40px rgba(0,0,0,.6)';}
   d.appendChild(im);
   if(who)d.classList.add(id===who?'lit':'dim');
   sprBox.appendChild(d);
 });
}
function setSprites(list){
 G.sprites={};(list||[]).forEach(pr=>{if(SPR[pr[0]])G.sprites[pr[0]]=pr[1];});
 renderSprites();
}
function pushLog(e){G.log.push({n:e.name||'',t:e.say});if(G.log.length>120)G.log.shift();}
function showSay(e){
 nameEl.textContent=e.name||'';nameEl.style.display=e.name?'block':'none';
 renderSprites(e.who);box.textContent='';advEl.style.opacity=0;
 G.full=e.say;G.waiting=true;G.typing=true;pushLog(e);
 clearInterval(typeT);
 if(G.skip){box.textContent=G.full;doneType();armAuto();return;}
 let i=0;
 typeT=setInterval(()=>{i++;box.textContent=G.full.slice(0,i);if(i%4===0)sfx('blip');
   if(i>=G.full.length){clearInterval(typeT);doneType();armAuto();}},26);
}
function doneType(){G.typing=false;G.waiting=true;advEl.style.opacity=1;}
function finishType(){clearInterval(typeT);box.textContent=G.full;doneType();}
function armAuto(){clearTimeout(autoT);
 if(G.auto||G.skip)autoT=setTimeout(()=>{if((G.auto||G.skip)&&G.started&&!cardOpen&&!itemOpen&&!choiceOpen)nextEvt();},G.skip?140:1500);}
function nextEvt(){clearTimeout(autoT);G.idx++;run();}
function showCard(e){
 G.chapter=e.card+'　'+(e.sub||'');$('chapterTag').textContent=G.chapter;
 $('cardTime').textContent=e.card;$('cardSub').textContent=e.sub||'';
 $('card').classList.add('show');cardOpen=true;sfx('whoosh');saveSlot('auto');
 cardT=setTimeout(dismissCard,2100);
}
function dismissCard(){if(!cardOpen)return;cardOpen=false;clearTimeout(cardT);$('card').classList.remove('show');nextEvt();}
function showItem(e){
 const bx=$('itemBox');
 if(e.item==='note'){bx.innerHTML='<div class="paper"><div class="hand">可愛的Z，<br>今晚要給你一個大驚喜♡</div></div>';}
 else{const src=(SPR.teacher&&SPR.teacher.src)||IMG.teacher;
   bx.innerHTML='<div class="polaroid"><img src="'+src+'"><div class="cap">PM 14:05　透天厝門口</div></div>';}
 $('itemCap').textContent=e.cap||'';$('itemOv').classList.add('show');itemOpen=true;sfx('ding');
}
function closeItem(){itemOpen=false;$('itemOv').classList.remove('show');nextEvt();}
function showChoice(e){
 choiceOpen=true;const c=$('choices');c.innerHTML='';c.classList.add('show');
 e.choice.forEach(op=>{
   const b=document.createElement('button');b.textContent=op.t;
   b.onclick=ev=>{ev.stopPropagation();sfx('ding');
     if(op.set)G.flags[op.set[0]]=op.set[1];
     c.classList.remove('show');choiceOpen=false;
     G.idx=op.go?LABELS[op.go]:G.idx+1;saveSlot('auto');run();};
   c.appendChild(b);
 });
}
function doFx(f){
 if(f==='shake'){$('stage').classList.remove('shake');void $('stage').offsetWidth;$('stage').classList.add('shake');sfx('shock');}
 if(f==='flash'){const fl=$('flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');}
}
function showEnd(en){
 try{const arr=JSON.parse(localStorage.getItem('pd_end')||'[]');if(!arr.includes(en.id)){arr.push(en.id);localStorage.setItem('pd_end',JSON.stringify(arr));}}catch(e){}
 playMusic('title');
 $('endTitle').textContent=en.title;
 const L=$('endLines');L.innerHTML='';
 en.lines.forEach((ln,i)=>{const d=document.createElement('div');d.textContent=ln;d.style.animationDelay=(0.4+i*0.9)+'s';L.appendChild(d);});
 $('endOv').classList.add('show');
}
function run(){
 G.waiting=false;
 if(G.idx>=SCRIPT.length)return;
 const e=SCRIPT[G.idx];
 if(e.cond&&G.flags[e.cond[0]]!==e.cond[1]){G.idx++;return run();}
 if(e.label){G.idx++;return run();}
 if(e.bg){setBg(e.bg);G.idx++;return run();}
 if(e.bgm){playMusic(e.bgm);G.idx++;return run();}
 if(e.sfx){sfx(e.sfx);G.idx++;return run();}
 if(e.fx){doFx(e.fx);G.idx++;return run();}
 if(e.sp){setSprites(e.sp);G.idx++;return run();}
 if(e.card){showCard(e);return;}
 if(e.item){showItem(e);return;}
 if(e.choice){showChoice(e);return;}
 if(e.say!==undefined){showSay(e);return;}
 if(e.end){showEnd(e.end);return;}
 G.idx++;run();
}
/* ================= 存讀檔 ================= */
function snapshot(){return JSON.stringify({idx:G.idx,flags:G.flags,sprites:G.sprites,bg:G.curBg,bgm:MUS.cur,chapter:G.chapter,time:new Date().toLocaleString()});}
function saveSlot(s){try{localStorage.setItem('pd_save_'+s,snapshot());}catch(e){}}
function loadSlot(s){
 let d;try{d=JSON.parse(localStorage.getItem('pd_save_'+s));}catch(e){}
 if(!d)return false;
 G.flags=d.flags||{};G.sprites=d.sprites||{};G.chapter=d.chapter||'';
 $('chapterTag').textContent=G.chapter;
 renderSprites();setBg(d.bg,true);playMusic(d.bgm);
 G.idx=d.idx||0;return true;
}
function openSys(mode){
 $('sysTitle').textContent=mode==='save'?'存 檔':'讀 檔';
 const L=$('slotList');L.innerHTML='';
 ['auto','1','2','3'].forEach(s=>{
   let d=null;try{d=JSON.parse(localStorage.getItem('pd_save_'+s));}catch(e){}
   const row=document.createElement('div');row.className='slot';
   row.innerHTML='<div class="info"><b>'+(s==='auto'?'自動存檔':'存檔 '+s)+'</b><small>'+(d?(d.chapter||'')+'・'+(d.time||''):'—— 空 ——')+'</small></div>';
   const bs=document.createElement('button');bs.textContent='儲存';bs.disabled=(s==='auto');
   bs.onclick=ev=>{ev.stopPropagation();saveSlot(s);openSys(mode);};
   const bl=document.createElement('button');bl.textContent='讀取';bl.disabled=!d;
   bl.onclick=ev=>{ev.stopPropagation();$('sysOv').classList.remove('show');
     if(loadSlot(s)){$('titleScr').style.display='none';G.started=true;G.log=[];run();}};
   row.appendChild(bs);row.appendChild(bl);L.appendChild(row);
 });
 $('sysOv').classList.add('show');
}
/* ================= 輸入 ================= */
$('stage').addEventListener('click',()=>{
 if(!G.started)return;
 if(itemOpen){closeItem();return;}
 if(cardOpen){dismissCard();return;}
 if(choiceOpen)return;
 if(G.typing){finishType();return;}
 if(G.waiting)nextEvt();
});
$('hud').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' '){e.preventDefault();if(document.activeElement)document.activeElement.blur();$('stage').click();}
 if(e.key==='Escape'){$('logOv').classList.remove('show');$('sysOv').classList.remove('show');}
});
$('btnAuto').onclick=()=>{G.auto=!G.auto;$('btnAuto').classList.toggle('on',G.auto);if(G.auto)armAuto();};
$('btnSkip').onclick=()=>{G.skip=!G.skip;$('btnSkip').classList.toggle('on',G.skip);if(G.skip&&!G.typing)nextEvt();};
$('btnLog').onclick=()=>{const L=$('logList');L.innerHTML='';G.log.forEach(r=>{const d=document.createElement('div');d.innerHTML=(r.n?'<b>'+r.n+'</b>':'<b>旁白</b>')+r.t;L.appendChild(d);});$('logOv').classList.add('show');};
$('logClose').onclick=e=>{e.stopPropagation();$('logOv').classList.remove('show');};
$('btnSave').onclick=()=>openSys('save');
$('btnLoad').onclick=()=>openSys('load');
$('sysClose').onclick=e=>{e.stopPropagation();$('sysOv').classList.remove('show');};
$('btnMus').onclick=()=>{AC.on=!AC.on;if(AC.ctx){AC.mus.gain.value=AC.on?.55:0;AC.sfxG.gain.value=AC.on?.8:0;}$('btnMus').textContent=AC.on?'♪ ON':'♪ OFF';$('btnMus').classList.toggle('on',!AC.on);};
$('btnHome').onclick=()=>{saveSlot('auto');toTitle();};
$('endHome').onclick=()=>{$('endOv').classList.remove('show');toTitle();};
/* ================= 標題 / 啟動 ================= */
function stars(){
 let arr=[];try{arr=JSON.parse(localStorage.getItem('pd_end')||'[]');}catch(e){}
 $('endStars').textContent=['A','B','C'].map(x=>(arr.includes(x)?'◆':'◇')+' END '+x).join('　');
}
function toTitle(){
 G.started=false;G.idx=0;G.flags={};G.sprites={};G.log=[];
 sprBox.innerHTML='';box.textContent='';nameEl.style.display='none';$('chapterTag').textContent='';
 sprBox.classList.remove('three');
 $('titleScr').style.display='flex';stars();
 let c=null;try{c=localStorage.getItem('pd_save_auto');}catch(e){}
 $('btnCont').disabled=!c;
}
$('titleScr').addEventListener('pointerdown',()=>{audioInit();if(AC.ctx.resume)AC.ctx.resume();playMusic('title');});
$('btnStart').onclick=e=>{e.stopPropagation();audioInit();if(AC.ctx.resume)AC.ctx.resume();
 $('titleScr').style.display='none';G.started=true;G.idx=0;G.flags={};G.sprites={};G.log=[];playMusic('title');run();};
$('btnCont').onclick=e=>{e.stopPropagation();audioInit();if(AC.ctx.resume)AC.ctx.resume();
 if(loadSlot('auto')){$('titleScr').style.display='none';G.started=true;run();}};
/* ================= 載入資源 ================= */
(async function boot(){
 const keys=Object.keys(IMG);let done=0;
 const tasks=keys.map(k=>{
   if(SPRITE_IDS.includes(k))
     return prepSprite(k).finally(()=>{done++;$('loadFill').style.width=(done/keys.length*100)+'%';});
   return loadImg(IMG[k]).catch(()=>{}).finally(()=>{done++;$('loadFill').style.width=(done/keys.length*100)+'%';});
 });
 await Promise.all(tasks);
 $('titleScr').style.backgroundImage='url("'+IMG.bg_title+'")';
 $('loadScr').style.display='none';
 toTitle();
})();
</script>
</body>
